# سيرفر الريلز والميديا (منفصل عن سيرفر الشات). ملفات على R2، بيانات على D1.
name = "adwmx-reels3"
main = "worker.js"
compatibility_date = "2026-11-05"
workers_dev = true
preview_urls = false

# بينشئ الـ bucket adwmx-reels3 قبل النشر (لو موجود بيكمل عادي)
[build]
command = "npx wrangler r2 bucket create adwmx-reels3 || true"

[observability]
enabled = true

# من غير database_id / مفاتيح: wrangler بينشئ القاعدة والـ bucket تلقائياً أول نشر.
[[d1_databases]]
binding = "DB"
database_name = "adwmx-reels3"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "adwmx-reels3"

# الاتصال بسيرفر الشات للتعرف على الحساب (لازم يكون اسمه نفس اسم الـ Worker المنشور هناك)
[[services]]
binding = "MAIN"
service = "adwmx-chat2"

# تنضيف يومي 3 الفجر (UTC)
[triggers]
crons = ["0 3 * * *"]

[vars]
MAIN_URL = "https://adwmx-chat2.jffnco.workers.dev"
DEBUG = "true"
